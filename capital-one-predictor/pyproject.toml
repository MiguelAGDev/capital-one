[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capital-one-predictor"
version = "0.1.0"
description = "Motor de pronostico de flujo de caja (diario + mensual con backbone real de INEGI) para Capital PyMe."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
]

[tool.setuptools.packages.find]
include = ["capital_one_predictor*"]
